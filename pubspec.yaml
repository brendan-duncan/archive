name: archive
version: 4.6.0
description: >-
  Provides encoders and decoders for various archive and compression formats
  such as zip, tar, bzip2, gzip, zlib, xz, and zstd.
repository: https://github.com/brendan-duncan/archive
topics:
  - archive
  - zip
  - tar
  - gzip
  - xz
environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  path: ^1.8.0
  posix: ^6.0.2

dev_dependencies:
  # Demo can also be built with  `dart compile js web/test_zip.dart -o web/test_zip.dart.js`,
  # then run `python3 -m http.server -d web` and open localhost:8000/test_zip.html
  build_runner: ^2.4.14
  build_web_compilers: ^4.1.0
  http: ^1.1.0
  lints: ^4.0.0
  test: ^1.24.6
  web: ^1.1.0
